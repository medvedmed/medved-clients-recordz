<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedPodo design comparison</title>
    <style>
      body { margin: 0; padding: 32px; background: #eef2f7; font-family: Arial, sans-serif; color: #10264f; }
      main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; max-width: 1440px; margin: auto; }
      figure { margin: 0; background: #fff; padding: 18px; border-radius: 16px; box-shadow: 0 10px 32px #10264f14; }
      figcaption { font-weight: 700; margin-bottom: 12px; }
      img { display: block; width: 100%; height: auto; object-fit: contain; background: #fff; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>Selected blue visual target</figcaption><img src="/qa-reference.png" alt="Selected blue MedPodo design" /></figure>
      <figure><figcaption>Rendered client-search screen</figcaption><img src="/qa-implementation.png" alt="Rendered MedPodo client search screen" /></figure>
    </main>
  </body>
</html>
